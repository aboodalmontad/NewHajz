    <script>
      // Suppress Vite HMR WebSocket connection errors in environments where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
          (event.reason instanceof Error && event.reason.message && event.reason.message.includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>
