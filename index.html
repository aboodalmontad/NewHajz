
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Immediately suppress Vite HMR WebSocket errors in environments where HMR is disabled
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite:ws') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>

      ::-webkit-scrollbar-thumb {

        border-radius: 6px;
        border: 2px solid #0f172a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0284c7;
      }
      ::-webkit-scrollbar-corner {
        background: #0f172a;
      }

        scrollbar-width: thin;
        scrollbar-color: #38bdf8 #0f172a;
      }

        background: #f59e0b !important;

      }
